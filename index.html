<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
    <title>Rounding Kick</title>
    <link rel="preload" as="image" href="TemplateData/rk-loading-art.jpg?v=angle-20261017-0034">
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0340CE;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #stage {
        position: relative;
        aspect-ratio: 9 / 16;
        width: min(100%, calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 9 / 16));
        height: min(100%, calc((100vw - env(safe-area-inset-left) - env(safe-area-inset-right)) * 16 / 9));
        max-width: 100%;
        max-height: 100%;
        background: #0340CE;
        touch-action: none;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #0340CE;
        touch-action: none;
      }
      #unity-canvas.rk-pending {
        visibility: hidden;
      }
      #rk-loading {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: flex;
        flex-direction: column;
        background: #ABC2D4;
        overflow: hidden;
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      #rk-loading.rk-hide {
        opacity: 0;
      }
      #rk-art {
        display: block;
        width: 100%;
        height: auto;
        max-height: 89%;
        object-fit: contain;
        object-position: center bottom;
        flex: 0 1 auto;
        background: #0340CE;
      }
      #rk-loading.rk-failed #rk-art {
        max-height: 74%;
      }
      #rk-load-ui {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.65em;
        min-height: 11%;
        padding: 0 8% 2.2%;
        box-sizing: border-box;
        background: #ABC2D4;
        color: #C9A24A;
        font-family: "Segoe UI", "Trebuchet MS", "Helvetica Neue", Arial, sans-serif;
      }
      #rk-status, #rk-studio, #rk-error {
        margin: 0;
      }
      #rk-status {
        font-size: clamp(16px, 2.5vh, 22px);
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #rk-bar {
        width: 40%;
        min-width: 140px;
        height: 14px;
        box-sizing: border-box;
        padding: 2px;
        border-radius: 999px;
        background: #C9A24A;
      }
      #rk-track {
        height: 100%;
        border-radius: inherit;
        overflow: hidden;
        background: #D7E7F0;
      }
      #rk-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: #7EFEFC;
      }
      #rk-bar.rk-wait #rk-fill {
        width: 28%;
        animation: rk-indet 1.05s ease-in-out infinite;
      }
      @keyframes rk-indet {
        0% { transform: translateX(-140%); }
        100% { transform: translateX(400%); }
      }
      #rk-studio {
        font-size: clamp(11px, 1.55vh, 14px);
        font-weight: 600;
        letter-spacing: 0.26em;
      }
      #rk-error {
        max-width: 18em;
        color: #1C3358;
        font-size: 13px;
        line-height: 1.35;
        text-align: center;
      }
      #rk-retry {
        border: 0;
        border-radius: 999px;
        min-height: 44px;
        padding: 0 18px;
        background: #123A9A;
        color: #F4EFE4;
        font: 600 15px/1 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        touch-action: manipulation;
      }
      #rk-build {
        position: fixed;
        left: calc(8px + env(safe-area-inset-left));
        bottom: calc(8px + env(safe-area-inset-bottom));
        margin: 0;
        max-width: 70vw;
        color: #c8c2b4;
        font: 12px/1.3 "Segoe UI", sans-serif;
        z-index: 2;
        pointer-events: none;
      }
      body:not(.rk-ready) #rk-build,
      body:not(.rk-ready) #rk-restart {
        visibility: hidden;
      }
      #rk-restart {
        position: fixed;
        bottom: calc(8px + env(safe-area-inset-bottom));
        right: calc(8px + env(safe-area-inset-right));
        z-index: 3;
        margin: 0;
        padding: 6px 10px;
        border: 0;
        border-radius: 8px;
        background: rgba(16, 20, 28, 0.72);
        color: #f4efe4;
        font: 13px/1 "Segoe UI", sans-serif;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" class="rk-pending" width="1080" height="1920" tabindex="-1"></canvas>
      <div id="rk-loading" role="status" aria-live="polite" aria-busy="true">
        <img id="rk-art" src="TemplateData/rk-loading-art.jpg?v=angle-20261017-0034" alt="Rounding Kick">
        <div id="rk-load-ui">
          <p id="rk-status">Loading…</p>
          <div id="rk-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading">
            <div id="rk-track"><div id="rk-fill"></div></div>
          </div>
          <p id="rk-studio">DANDON GAMES</p>
          <p id="rk-error" hidden></p>
          <button id="rk-retry" type="button" hidden>Retry</button>
        </div>
      </div>
    </div>
    <p id="rk-build">Drag the ball and release. angle-20261017-0034</p>
    <button id="rk-restart" type="button">Reload</button>
    <script src="Build/angle-20261017-0034.loader.js?v=angle-20261017-0034"></script>
    <script>
      (function () {
        var stage = document.getElementById("stage");
        var canvas = document.getElementById("unity-canvas");
        var loading = document.getElementById("rk-loading");
        var fill = document.getElementById("rk-fill");
        var bar = document.getElementById("rk-bar");
        var status = document.getElementById("rk-status");
        var errorText = document.getElementById("rk-error");
        var retry = document.getElementById("rk-retry");
        var booting = false;

        function block(event) {
          if (stage.contains(event.target)) event.preventDefault();
        }
        document.addEventListener("touchmove", block, { passive: false });
        document.addEventListener("wheel", block, { passive: false });
        stage.addEventListener("gesturestart", block, { passive: false });
        document.getElementById("rk-restart").addEventListener("click", function () {
          window.location.reload();
        });
        retry.addEventListener("click", function () {
          window.location.reload();
        });

        function setProgress(progress) {
          if (typeof progress !== "number" || !isFinite(progress)) {
            bar.classList.add("rk-wait");
            status.textContent = "Starting game…";
            return;
          }
          var clamped = Math.max(0, Math.min(1, progress));
          if (clamped >= 1) {
            bar.classList.add("rk-wait");
            status.textContent = "Starting game…";
            return;
          }
          bar.classList.remove("rk-wait");
          var pct = Math.round(clamped * 100);
          fill.style.width = pct + "%";
          bar.setAttribute("aria-valuenow", String(pct));
          status.textContent = "Loading…";
        }

        function showError(message) {
          booting = false;
          loading.classList.add("rk-failed");
          loading.classList.remove("rk-hide");
          loading.hidden = false;
          loading.setAttribute("aria-busy", "false");
          bar.classList.remove("rk-wait");
          fill.style.width = "0%";
          bar.setAttribute("aria-valuenow", "0");
          status.textContent = "Could not load the game.";
          errorText.hidden = false;
          var detail = message ? String(message) : "";
          if (!detail || detail.length > 90 || detail.indexOf("\n") >= 0)
            detail = "Check the connection and try again.";
          errorText.textContent = detail;
          if (message) console.error(message);
          retry.hidden = false;
        }

        function reveal(unityInstance) {
          window.rkUnity = unityInstance;
          document.body.classList.add("rk-ready");
          canvas.classList.remove("rk-pending");
          loading.setAttribute("aria-busy", "false");
          loading.classList.add("rk-hide");
          window.setTimeout(function () {
            loading.hidden = true;
          }, 460);
        }

        function wireRelease(unityInstance) {
          function toUnity(touch) {
            var rect = canvas.getBoundingClientRect();
            if (!rect.width || !rect.height)
              return "";
            var x = (touch.clientX - rect.left) / rect.width * canvas.width;
            var y = (rect.bottom - touch.clientY) / rect.height * canvas.height;
            return ":" + Math.round(x) + ":" + Math.round(y);
          }
          function notifyTouch(kind, event) {
            var changed = event.changedTouches;
            if (!changed || changed.length === 0)
              return;
            var remaining = event.touches ? event.touches.length : 0;
            for (var i = 0; i < changed.length; i++) {
              unityInstance.SendMessage("AngleChallenge", "BrowserTouch", kind + ":" + changed[i].identifier + ":" + remaining + toUnity(changed[i]));
            }
          }
          document.addEventListener("touchend", function (event) { notifyTouch("up", event); }, true);
          document.addEventListener("touchcancel", function (event) { notifyTouch("up", event); }, true);
          document.addEventListener("pointerup", function (event) {
            if (event.pointerType === "mouse")
              return;
            unityInstance.SendMessage("AngleChallenge", "BrowserTouch", "up:" + event.pointerId + ":0" + toUnity(event));
          }, true);
          document.addEventListener("pointercancel", function (event) {
            if (event.pointerType === "mouse")
              return;
            unityInstance.SendMessage("AngleChallenge", "BrowserTouch", "up:" + event.pointerId + ":0" + toUnity(event));
          }, true);
        }

        function boot() {
          if (booting || window.rkUnity)
            return;
          if (typeof createUnityInstance !== "function") {
            showError("The game loader did not download.");
            return;
          }
          booting = true;
          loading.classList.remove("rk-failed");
          retry.hidden = true;
          errorText.hidden = true;
          setProgress(0);
          var started = performance.now();
          var instance;
          try {
            instance = createUnityInstance(canvas, {
            arguments: [],
            dataUrl: "Build/angle-20261017-0034.data.unityweb?v=angle-20261017-0034",
            frameworkUrl: "Build/angle-20261017-0034.framework.js.unityweb?v=angle-20261017-0034",
            codeUrl: "Build/angle-20261017-0034.wasm.unityweb?v=angle-20261017-0034",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "Rounding Kick",
            productVersion: "0.1.0",
            devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
          }, function (progress) {
            setProgress(progress);
          }).then(function (unityInstance) {
            window.rkLoadMs = Math.round(performance.now() - started);
            wireRelease(unityInstance);
            reveal(unityInstance);
          }).catch(function (message) {
            showError(message);
          });
          } catch (message) {
            showError(message);
            return;
          }
        }

        boot();
      })();
    </script>
  </body>
</html>
